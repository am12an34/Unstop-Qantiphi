services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 5000
      # Uses the bundled Mongo container; set MONGO_URI in your shell to use Atlas instead
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/eventsapp}
      CLIENT_URL: http://localhost:5173
      SERVER_URL: http://localhost:5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo-data:
