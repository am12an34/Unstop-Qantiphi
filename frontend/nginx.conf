server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Long cache for hashed assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback so /dashboard and invite links load the app
  location / {
    try_files $uri /index.html;
  }
}
